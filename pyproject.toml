[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-capacity-planner"
version = "0.1.0"
description = "Load-test a locally served LLM and turn the measurements into a GPU count and monthly cost for a given number of chat users."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8"]

[project.scripts]
capplan = "capplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
